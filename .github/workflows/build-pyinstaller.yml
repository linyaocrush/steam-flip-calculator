name: Build with PyInstaller

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.0.0)'
        required: true
        type: string
        default: '0.0.0'
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Custom release notes (supports Markdown)'
        required: false
        type: string
        default: ''

env:
  PYTHON_VERSION: '3.12'
  PYTHONUTF8: 1

jobs:
  build:
    name: Build Windows with PyInstaller
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build onefile version
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --name SteamFlipCalculator-OneFile --add-data "src;src" --collect-all flet --collect-all flet_desktop src/main.py

      - name: Build standalone version
        shell: pwsh
        run: |
          pyinstaller --noconsole --name SteamFlipCalculator --add-data "src;src" --collect-all flet --collect-all flet_desktop src/main.py

      - name: Create release directories
        shell: bash
        run: |
          mkdir -p release/onefile
          mkdir -p release/standalone
          mkdir -p release/installer
          
          cp dist/SteamFlipCalculator-OneFile.exe release/onefile/
          cp -r dist/SteamFlipCalculator/* release/standalone/

      - name: Create standalone ZIP archive
        shell: bash
        run: |
          cd release/standalone
          7z a -tzip ../../SteamFlipCalculator-${{ github.event.inputs.version }}-standalone-windows.zip *

      - name: Create Inno Setup installer script for standalone
        shell: bash
        run: |
          cat > installer.iss << 'EOF'
          [Setup]
          AppName=Steam 倒余额工具箱
          AppVersion=${{ github.event.inputs.version }}
          AppPublisher=SteamFlipCalculator
          DefaultDirName={pf}\SteamFlipCalculator
          DefaultGroupName=Steam 倒余额工具箱
          OutputBaseFilename=SteamFlipCalculator-${{ github.event.inputs.version }}-setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          MinVersion=10.0
          OutputDir=release/installer
          
          [Tasks]
          Name: "desktopicon"; Description: "Create desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked
          Name: "quicklaunchicon"; Description: "Create quick launch icon"; GroupDescription: "Additional icons:"; Flags: unchecked; OnlyBelowVersion: 6.1
          
          [Files]
          Source: "release\standalone\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{group}\Steam 倒余额工具箱"; Filename: "{app}\SteamFlipCalculator.exe"
          Name: "{group}\卸载"; Filename: "{uninstallexe}"
          Name: "{commondesktop}\Steam 倒余额工具箱"; Filename: "{app}\SteamFlipCalculator.exe"; Tasks: desktopicon
          Name: "{userappdata}\Microsoft\Internet Explorer\Quick Launch\Steam 倒余额工具箱"; Filename: "{app}\SteamFlipCalculator.exe"; Tasks: quicklaunchicon
          
          [Run]
          Filename: "{app}\SteamFlipCalculator.exe"; Description: "Launch Steam 倒余额工具箱"; Flags: nowait postinstall skipifsilent
          
          [UninstallDelete]
          Type: filesandordirs; Name: "{app}\data"
          EOF

      - name: Install Inno Setup
        shell: bash
        run: |
          choco install innosetup -y

      - name: Build installer with Inno Setup
        shell: bash
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss

      - name: List files before upload
        shell: bash
        run: |
          echo "=== Root directory ==="
          ls -la
          echo ""
          echo "=== release/onefile ==="
          ls -la release/onefile/ || echo "Directory not found"
          echo ""
          echo "=== release/standalone ==="
          ls -la release/standalone/ || echo "Directory not found"
          echo ""
          echo "=== release/installer ==="
          ls -la release/installer/ || echo "Directory not found"
          echo ""
          echo "=== ZIP files in root ==="
          ls -la *.zip 2>/dev/null || echo "No ZIP files found"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            release/
            *.zip
          retention-days: 30
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: .

      - name: List downloaded files
        run: |
          echo "=== All downloaded files ==="
          find . -type f | sort
          echo ""
          echo "=== EXE files ==="
          find . -name "*.exe"
          echo ""
          echo "=== ZIP files ==="
          find . -name "*.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            release/onefile/*.exe
            *.zip
            release/installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build Flet App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.0.0)'
        required: true
        type: string
        default: '0.0.0'
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Custom release notes (supports Markdown)'
        required: false
        type: string
        default: ''

env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            build_cmd: "flet build windows --no-web-view"
            artifact_path: build/windows
            needs_linux_deps: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
            sudo apt update --allow-releaseinfo-change
            LINUX_DEPS="$(uv run python -c 'from flet.utils.linux_deps import linux_dependencies; print(" ".join(linux_dependencies))')"
            sudo apt-get install -y --no-install-recommends $LINUX_DEPS
            sudo apt-get clean

      - name: Build app
        shell: bash
        run: |
          uv run ${{ matrix.build_cmd }} --yes --verbose

      - name: Create release directory
        if: matrix.name == 'windows'
        shell: bash
        run: |
          mkdir -p release
          cp -r build/windows/* release/
          
          # Create README for release
          cat > release/使用说明.txt << 'EOF'
          # Steam 倒余额工具箱
          
          版本: ${{ github.event.inputs.version }}
          
          ## 快速开始
          
          1. 双击运行 SteamFlipCalculator.exe
          2. 首次运行会自动创建数据库文件
          
          ## 系统要求
          
          - Windows 10 或更高版本
          - 64位操作系统
          
          ## 注意事项
          
          - 请确保 src 和 data 文件夹与程序在同一目录
          - 首次运行可能需要防火墙权限
          - 建议将整个文件夹放在非系统盘
          - 数据库文件位于 data 文件夹，建议定期备份
          
          ## 问题反馈
          
          如遇问题，请访问 GitHub 提交 Issue
          EOF

      - name: Create ZIP archive
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cd release
          7z a -tzip ../SteamFlipCalculator-${{ github.event.inputs.version }}-windows.zip *

      - name: Create Inno Setup installer script
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cat > installer.iss << 'EOF'
          [Setup]
          AppName=Steam 倒余额工具箱
          AppVersion=${{ github.event.inputs.version }}
          AppPublisher=SteamFlipCalculator
          DefaultDirName={pf}\SteamFlipCalculator
          DefaultGroupName=Steam 倒余额工具箱
          OutputBaseFilename=SteamFlipCalculator-${{ github.event.inputs.version }}-setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          MinVersion=10.0
          OutputDir=release
          
          [Languages]
          Name: "chinesesimp"; MessagesFile: "compiler:Languages\ChineseSimp.isl"
          
          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加图标:"; Flags: unchecked
          Name: "quicklaunchicon"; Description: "创建快速启动图标"; GroupDescription: "附加图标:"; Flags: unchecked; OnlyBelowVersion: 6.1
          
          [Files]
          Source: "release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{group}\Steam 倒余额工具箱"; Filename: "{app}\SteamFlipCalculator.exe"
          Name: "{group}\使用说明"; Filename: "{app}\使用说明.txt"
          Name: "{group}\卸载"; Filename: "{uninstallexe}"
          Name: "{commondesktop}\Steam 倒余额工具箱"; Filename: "{app}\SteamFlipCalculator.exe"; Tasks: desktopicon
          Name: "{userappdata}\Microsoft\Internet Explorer\Quick Launch\Steam 倒余额工具箱"; Filename: "{app}\SteamFlipCalculator.exe"; Tasks: quicklaunchicon
          
          [Run]
          Filename: "{app}\SteamFlipCalculator.exe"; Description: "启动 Steam 倒余额工具箱"; Flags: nowait postinstall skipifsilent
          
          [UninstallDelete]
          Type: filesandordirs; Name: "{app}\data"
          EOF

      - name: Install Inno Setup
        if: matrix.name == 'windows'
        shell: bash
        run: |
          choco install innosetup -y

      - name: Build installer with Inno Setup
        if: matrix.name == 'windows'
        shell: bash
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ matrix.name }}-build-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false

      - name: Upload release package
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            SteamFlipCalculator-*-windows.zip
            release/*.exe
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            release/*.zip
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}